name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  classroom-v2:
    name: "새 교실 저장·권한·GitHub 회귀 검증"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix server ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node --test server/classroom/*.test.js server/middleware/*.test.js server/lan/*.test.js server/routes/*.test.js server/utils/*.test.js scripts/classroom/backup.test.mjs cloudflare/*.test.js
      - run: npm --prefix client run build:classroom
      - run: node scripts/classroom/check-curriculum.mjs

  # ──────────────────────────────────────────────
  # 1. 미션 데이터 무결성 검사
  # ──────────────────────────────────────────────
  validate-missions:
    name: "미션 데이터 검증"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run mission tests
        # missions.grading.test.js가 python3로 vpython-api.py를 실행해 "시작 코드 실패·모범 답안 통과"를 검증한다
        working-directory: client
        run: npm run test:run

  # ──────────────────────────────────────────────
  # 2. i18n 번역 완전성 검사
  # ──────────────────────────────────────────────
  validate-i18n:
    name: "번역 키 검증"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check i18n key completeness
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const i18nDir = 'client/src/i18n';
          const files = fs.readdirSync(i18nDir).filter(f => f.endsWith('.json'));

          if (files.length < 2) {
            console.log('Only one language file found, skipping comparison.');
            process.exit(0);
          }

          // en.json을 기준으로 다른 언어 파일의 키 누락을 검사
          const enPath = path.join(i18nDir, 'en.json');
          const enData = JSON.parse(fs.readFileSync(enPath, 'utf8'));

          function flattenKeys(obj, prefix = '') {
            return Object.entries(obj).reduce((acc, [key, val]) => {
              const fullKey = prefix ? `${prefix}.${key}` : key;
              if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
                return [...acc, ...flattenKeys(val, fullKey)];
              }
              return [...acc, fullKey];
            }, []);
          }

          const enKeys = flattenKeys(enData);
          let hasError = false;

          for (const file of files) {
            if (file === 'en.json') continue;
            const lang = file.replace('.json', '');
            const langData = JSON.parse(fs.readFileSync(path.join(i18nDir, file), 'utf8'));
            const langKeys = flattenKeys(langData);

            const missing = enKeys.filter(k => !langKeys.includes(k));
            const extra = langKeys.filter(k => !enKeys.includes(k));

            if (missing.length > 0) {
              console.error(`\n[${lang}] Missing ${missing.length} keys:`);
              missing.forEach(k => console.error(`  - ${k}`));
              hasError = true;
            }

            if (extra.length > 0) {
              console.warn(`\n[${lang}] Extra ${extra.length} keys (not in en.json):`);
              extra.forEach(k => console.warn(`  + ${k}`));
            }
          }

          if (hasError) {
            console.error('\ni18n key validation failed. See missing keys above.');
            process.exit(1);
          }

          console.log(`\ni18n key validation passed. ${files.length} language files checked.`);
          EOF

  # ──────────────────────────────────────────────
  # 3. 미션 i18n 필드 검증
  # ──────────────────────────────────────────────
  validate-mission-i18n:
    name: "미션 다국어 필드 검증"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Check mission i18n fields
        working-directory: client
        run: |
          node << 'EOF'
          // missions.js를 dynamic import로 읽어 ko/en 필드 존재 확인
          import('./src/data/missions.js').then(({ default: missions }) => {
            let hasError = false;
            const requiredLangs = ['ko', 'en'];

            for (const m of missions) {
              for (const lang of requiredLangs) {
                if (!m.title?.[lang]) {
                  console.error(`${m.id}: title.${lang} 누락`);
                  hasError = true;
                }
                if (!m.description?.[lang]) {
                  console.error(`${m.id}: description.${lang} 누락`);
                  hasError = true;
                }
                for (let i = 0; i < (m.hints?.length || 0); i++) {
                  if (!m.hints[i]?.[lang]) {
                    console.error(`${m.id}: hints[${i}].${lang} 누락`);
                    hasError = true;
                  }
                }
              }
            }

            if (hasError) {
              process.exit(1);
            }
            console.log(`Mission i18n check passed. ${missions.length} missions verified.`);
          });
          EOF

  # ──────────────────────────────────────────────
  # 4. 클라이언트 린트 검사
  # ──────────────────────────────────────────────
  lint:
    name: "린트 검증"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

  # ──────────────────────────────────────────────
  # 5. 클라이언트 빌드 검사
  # ──────────────────────────────────────────────
  build:
    name: "빌드 검증"
    runs-on: ubuntu-latest
    needs: [validate-missions, validate-i18n, validate-mission-i18n, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  # ──────────────────────────────────────────────
  # 6. 보안 검사
  # ──────────────────────────────────────────────
  security:
    name: "보안 검사"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for innerHTML usage
        run: |
          echo "Checking for unsafe HTML writes in client source..."
          # 실제 할당(.innerHTML = …)과 outerHTML / insertAdjacentHTML만 검출.
          # 주석·문서에서 단어만 언급한 것은 무시(false-positive 방지).
          if grep -rnE '(\.innerHTML[[:space:]]*=|\.outerHTML[[:space:]]*=|\.insertAdjacentHTML[[:space:]]*\()' \
              client/src/ --include='*.jsx' --include='*.js' --include='*.tsx' --include='*.ts' \
              | grep -v 'node_modules' | grep -v '.test.'; then
            echo "::error::Unsafe HTML write detected! Use textContent / createElement / appendChild instead for XSS prevention."
            exit 1
          fi
          echo "No unsafe HTML writes found. Security check passed."

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          # 패턴:
          #  - Supabase Secret API key (sb_secret_...)
          #  - Supabase service role JWT (eyJ... 시작 + role:service_role)
          #  - OpenAI API 키 형태 (sk-...)
          #  - 따옴표로 감싼 password 할당
          # 스캔 범위: 저장소 전체. 단, 정상적인 환경변수 참조와 .example/node_modules는 제외
          PATTERN='(sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|sk-[a-zA-Z0-9]{20,}|password[[:space:]]*=[[:space:]]*['\''"][^'\''\"]+['\''"])'
          if grep -rEn "$PATTERN" \
              --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.cjs" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
              --exclude="*.example" --exclude="*.example.*" \
              . ; then
            echo "::error::Potential hardcoded secret detected. Move it to an environment variable."
            exit 1
          fi
          echo "No secrets detected."
