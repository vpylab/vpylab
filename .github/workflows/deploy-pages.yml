# 오픈소스 판 자동 배포: main의 CI가 모두 통과하면 vpylab.pages.dev(Cloudflare Pages)에 올립니다.
#
# 필요한 설정(저장소 Settings → Secrets and variables → Actions)
#   - 비밀값 CLOUDFLARE_API_TOKEN: Cloudflare "Cloudflare Pages: Edit" 권한만 준 API 토큰
#   - 변수 CLOUDFLARE_ACCOUNT_ID: Cloudflare 계정 ID(공개해도 되는 값)
#   - 변수 VITE_GOOGLE_CLIENT_ID: 드라이브 실험용 구글 OAuth 클라이언트 ID(공개해도 되는 값)
# 비밀값이 없으면 배포 단계를 건너뛰고 안내만 남깁니다(포크에서 실패로 표시되지 않게).
#
# 안전장치
#   - main에 push된 커밋의 CI가 성공했을 때만 돕니다. 포크 PR의 CI 결과로는 돌지 않습니다.
#   - 같은 배포가 겹치지 않게 하나씩 차례로 돕니다.
#   - 배포 뒤 첫 화면·개인정보 화면·드라이브 실험 페이지가 200으로 열리는지 확인합니다.
name: Deploy open edition

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-open-edition
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: "오픈소스 판 배포 (vpylab.pages.dev)"
    if: >-
      github.repository == 'vpylab/vpylab' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check deploy settings
        id: settings
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 비밀값 또는 CLOUDFLARE_ACCOUNT_ID 변수가 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID 변수가 없어 드라이브 실험 페이지가 클라이언트 ID 없이 빌드됩니다."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.settings.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        if: steps.settings.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.settings.outputs.ready == 'true'
        working-directory: client
        run: npm ci

      - name: Build open edition
        if: steps.settings.outputs.ready == 'true'
        working-directory: client
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build:open

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.settings.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy client/dist --project-name=vpylab --branch=main --commit-hash=${{ env.DEPLOY_SHA }}

      - name: Smoke test
        if: steps.settings.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          base="${DEPLOY_URL:-https://vpylab.pages.dev}"
          for path in / /privacy /sandbox /drive-lab; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$base$path")
            echo "$base$path → $code"
            [ "$code" = "200" ] || { echo "::error::$base$path 응답 $code"; exit 1; }
          done
